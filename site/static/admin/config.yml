# Sveltia CMS — https://sveltiacms.app/en/docs
# The editor at /admin/ writes straight to the GitHub repository. Each save is
# a commit; the host rebuilds and publishes the site from that commit.

backend:
  name: github
  repo: ozerebelo/zemastudios
  # Must be the branch your host deploys from.
  branch: main
  # The site lives in site/ inside the repository; all paths below are relative to it.
  root_dir: site
  # "Sign in with GitHub" goes through Netlify's OAuth provider (the default
  # base_url, api.netlify.com) once a GitHub OAuth app is installed in Netlify;
  # see site/README.md. Until then, use "Sign in using access token".
  commit_messages:
    create: "Novo projeto: {{slug}}"
    update: "Atualizar {{collection}}: {{slug}}"
    delete: "Apagar {{collection}}: {{slug}}"
    uploadMedia: "Imagem: {{path}}"
    deleteMedia: "Apagar imagem: {{path}}"

app_title: zema studios
site_url: https://zemastudios.com
logo:
  src: /favicon.svg

media_folder: media/projetos
public_folder: /media/projetos

media_libraries:
  default:
    config:
      # Resizing for the web happens in the build, so upload the full-quality still.
      # This only stops accidental 4K PNG exports (24 MB each) from landing in the repo.
      max_file_size: 15000000
      slugify_filename: true

slug:
  encoding: ascii
  clean_accents: true

output:
  json:
    indent_style: space
    indent_size: 2

collections:
  - name: projetos
    label: Projetos
    label_singular: Projeto
    description: Cada projeto tem a sua página em /trabalho/nome-do-projeto/.
    folder: content/projetos
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: titulo
    slug: "{{titulo}}"
    summary: "{{ano}} · {{titulo}} {{subtitulo}}"
    thumbnail: capa
    sortable_fields:
      fields: [ano, titulo, formato]
      default:
        field: ano
        direction: descending
    view_filters:
      - label: Em destaque
        field: destaque
        pattern: true
      - label: Escondidos
        field: publicado
        pattern: false
    view_groups:
      - label: Formato
        field: formato
      - label: Ano
        field: ano
    preview_path: /trabalho/{{slug}}/
    fields:
      - name: titulo
        label: Título
        widget: string
        hint: O nome principal. A série, temporada ou artista vai no Subtítulo.
      - name: subtitulo
        label: Subtítulo
        widget: string
        required: false
        hint: "Série, temporada, artista ou complemento do título. Ex.: *Temporada 2*, *Novas Narrativas de Caça*, *Pedro Abrunhosa*."
      - name: ano
        label: Ano
        widget: number
        value_type: int
        min: 2000
        max: 2100
      - name: formato
        label: Formato
        widget: select
        options:
          - Série
          - Longa-metragem
          - Curta-metragem
          - Documentário
          - Videoclip
          - Publicidade
          - Conteúdo de marca
      - name: cliente
        label: Cliente / exibição
        widget: string
        required: false
        hint: Plataforma, canal ou marca. Ex. Prime Video, RTP, Betclic.
      - name: realizacao
        label: Realização
        widget: string
        required: false
      - name: fotografia
        label: Direção de fotografia
        widget: string
        required: false
      - name: producao
        label: Produção
        widget: string
        required: false
      - name: agencia
        label: Agência
        widget: string
        required: false
      - name: cor
        label: Cor
        widget: string
        required: false
        hint: Quem de vocês fez a cor deste projeto. Fica vazio se não quiserem mostrar.
      - name: capa
        label: Imagem de capa
        widget: image
        hint: Aparece no mosaico da página inicial e na grelha do Trabalho. Exporte JPEG de qualidade máxima, até 4K.
      - name: fotogramas
        label: Fotogramas
        widget: image
        multiple: true
        required: false
        hint: Arraste para mudar a ordem. São mostrados na proporção original, sem corte.
      - name: video
        label: Trailer ou vídeo
        widget: string
        required: false
        hint: Link do YouTube ou do Vimeo.
        pattern:
          - "^$|^https://(www\\.)?(youtube\\.com|youtu\\.be|vimeo\\.com|player\\.vimeo\\.com)/"
          - Tem de ser um link do YouTube ou do Vimeo
      - name: notas
        label: Notas
        widget: text
        required: false
        hint: Opcional. Factos curtos sobre o trabalho de cor (ex. entrega HDR, pipeline ACES).
      - name: destaque
        label: Em destaque
        widget: boolean
        default: false
        hint: Aparece primeiro no mosaico da página inicial.
      - name: ordem
        label: Ordem dentro do ano
        widget: number
        value_type: int
        default: 0
        required: false
        hint: Números mais baixos aparecem primeiro entre projetos do mesmo ano.
      - name: publicado
        label: Publicado
        widget: boolean
        default: true
        hint: Desligue para esconder o projeto sem o apagar.

singletons:
  - name: site
    label: Estúdio e textos
    file: content/site.json
    format: json
    fields:
      - name: nome
        label: Nome
        widget: string
        hint: Sempre em minúsculas, "zema studios".
      - name: url
        label: Endereço do site
        widget: string
        hint: Usado nos links de partilha e no sitemap.
      - name: descricao
        label: Descrição para o Google e partilhas
        widget: string
        maxlength: 160
      - name: intro
        label: Frase de apresentação
        widget: text
        hint: O título grande por baixo do mosaico da página inicial. Uma frase curta e verificável (ex. para quem fazemos cor). A linha ao lado é calculada a partir dos projetos e atualiza-se sozinha.
      - name: showreel
        label: Showreel
        widget: string
        required: false
        hint: Link do YouTube ou do Vimeo. Fica vazio se não houver.
      - name: sobre
        label: Sobre
        widget: object
        fields:
          - name: titulo
            label: Título
            widget: string
            required: false
            hint: O título do bloco na página inicial e na página Estúdio.
          - name: foto
            label: Fotografia do estúdio
            widget: image
            required: false
            hint: Aparece ao lado do texto, na página inicial e na página Estúdio. Corte vertical 4:5, com pelo menos 1200 px de largura.
          - name: foto_alt
            label: Descrição da fotografia
            widget: string
            required: false
            hint: Para quem não vê a imagem. Diga o que se vê.
          - name: texto
            label: Texto
            widget: text
            hint: Aparece em "O nosso trabalho" na página inicial e na página Estúdio. Deixe uma linha em branco entre parágrafos.
      - name: tecnico
        label: Ficha técnica
        label_singular: Linha
        widget: list
        summary: "{{rotulo}}: {{valor}}"
        fields:
          - { name: rotulo, label: Rótulo, widget: string }
          - { name: valor, label: Valor, widget: string }
      - name: contacto
        label: Contacto
        widget: object
        fields:
          - { name: texto, label: Texto, widget: text }
          - { name: email, label: Email, widget: string }
          - { name: telefone, label: Telefone, widget: string, required: false }
          - { name: instagram, label: Instagram (link), widget: string, required: false }
          - { name: vimeo, label: Vimeo (link), widget: string, required: false }
          - name: formspree
            label: Formulário (ID do Formspree)
            widget: string
            required: false
            hint: Vazio = sem formulário, só o email.
