# Local development dependencies only. Production uses managed Postgres and
# an S3-compatible bucket (Cloudflare R2 by default -- see the README).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zema
      POSTGRES_PASSWORD: zema
      POSTGRES_DB: zema
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zema"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zema
      MINIO_ROOT_PASSWORD: zemazema
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
